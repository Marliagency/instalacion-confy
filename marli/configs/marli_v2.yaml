# ───────────────────────────────────────────────────────────────────────────
# Marli — anuncio vertical 9:16 de 30 s (6 beats)
#
# Para variaciones: duplica este archivo y cambia `style`, `camera`, `seed`...
# Para 3 takes distintos del mismo anuncio: pon `seed: random` y corre 3 veces.
#   python3 comfy_generate.py configs/marli_v2.yaml [--simular]
# ───────────────────────────────────────────────────────────────────────────

name: marli_v2
fps: 24
resolution: [1080, 1920]

# Defaults globales (cada beat puede sobrescribirlos)
style: editorial          # editorial | cinematic | handheld | studio | golden-hour | noir
camera: slow-push-in      # static | slow-push-in | slow-orbit | dolly-left | dolly-right | handheld
seed: 42                  # entero (repetible) o "random"

music: music.wav          # pista de fondo (trompetas/tambores épicos)
audio_mix:
  music_vol: 0.18         # volumen de la música bajo las voces

brand:
  signature: marli
  accent_color: "#7a0c0c" # rojo Marli
  fonts:
    headline: fonts/DMSerifDisplay-Regular.ttf
    body: fonts/SpaceGrotesk-Regular.ttf

beats:
  # 1 — HOOK cinematográfico (mascota Marli en estudio premium)
  - n: 1
    type: cinematic
    id: hook
    dur: 5
    style: cinematic
    camera: slow-push-in
    prompt: >
      a friendly deep-red carbon-fiber robot mascot named Marli standing in a
      sleek minimal studio, glossy floor, soft volumetric light

  # 2 — PROBLEMA (text card)
  - n: 2
    type: textcard
    id: problem
    dur: 5
    style: editorial
    kicker: El problema
    headline: ¿Anuncios que nadie recuerda?
    subhead: Producir vídeo a escala cuesta tiempo y dinero.
    prompt: premium abstract cream background, soft warm gradients, subtle paper texture

  # 3 — 5 RAZONES (slideshow de 5 imágenes, 1 s cada una)
  - n: 3
    type: slideshow5
    id: razones
    dur: 5
    slide_dur: 1.0
    style: studio
    texts: ["1 · Rápido", "2 · Barato", "3 · Tuyo", "4 · Escalable", "5 · Premium"]
    slides:
      - close-up of a glowing red stopwatch on cream background, product photography
      - stack of coins next to a small red robot, soft studio light
      - a smartphone showing a vertical video ad, clean mockup
      - many vertical video thumbnails arranged in a grid, red accents
      - luxury editorial still life with deep red and cream tones

  # 4 — TESTIMONIO (UGC, persona hablando a cámara)
  - n: 4
    type: ugc
    id: testimonial
    dur: 5
    style: handheld
    camera: handheld
    prompt: >
      young woman talking enthusiastically to the camera at home, natural light,
      casual, authentic
    audio:
      source: tts            # tts | recorded | none
      voice_id: "REEMPLAZA_CON_TU_VOICE_ID"
      text: Desde que uso Marli produzco diez veces más anuncios en la mitad de tiempo.

  # 5 — DEMOSTRACIÓN cinematográfica (producto/escena)
  - n: 5
    type: cinematic
    id: demo
    dur: 5
    style: editorial
    camera: slow-orbit
    prompt: >
      elegant slow product reveal of a smartphone with the Marli app on screen,
      premium tabletop, cream and deep red palette

  # 6 — CTA final (text card con pill rojo)
  - n: 6
    type: textcard
    id: cta
    dur: 5
    style: editorial
    kicker: Empieza hoy
    headline: Tus anuncios, en minutos.
    subhead: Prueba Marli gratis.
    cta_pill: true
    cta: marli.app
    prompt: premium abstract cream background with a soft deep-red glow, minimal
