name: ComfyUI test image (CPU)

# Genera una imagen de prueba con ComfyUI dentro del runner de GitHub Actions
# (el runner tiene internet libre y GITHUB_TOKEN con escritura), usando el
# SDXL-Turbo (4 pasos, viable en CPU) y el propio comfy_batch.py del repo.
# Commitea el PNG resultante de vuelta al repo en outputs/.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/comfy-image.yml"
      - "workflows/sdxl_turbo.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone ComfyUI
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git comfyui

      - name: Install deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r comfyui/requirements.txt
          pip install requests websocket-client

      - name: Download SDXL-Turbo checkpoint
        run: |
          mkdir -p comfyui/models/checkpoints
          DEST=comfyui/models/checkpoints/sd_xl_turbo_1.0_fp16.safetensors
          # HuggingFace devuelve 429 (rate-limit) a descargas anónimas: reintentar
          # con backoff sobre TODOS los errores y probar fuentes alternativas.
          URLS=(
            "https://huggingface.co/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors?download=true"
            "https://huggingface.co/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors"
            "https://hf-mirror.com/stabilityai/sdxl-turbo/resolve/main/sd_xl_turbo_1.0_fp16.safetensors"
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "Descargando checkpoint desde: $url"
            if curl -L --fail --retry 10 --retry-delay 20 --retry-all-errors \
                 -H "User-Agent: Mozilla/5.0 (compatible; ci-bot)" \
                 -o "$DEST" "$url"; then
              ok=1; break
            fi
            echo "Fuente falló; probando la siguiente tras 15s..."; sleep 15
          done
          if [ "$ok" -ne 1 ]; then echo "ERROR: no se pudo descargar el checkpoint"; exit 1; fi
          # Validar que es un safetensors real (~6.9 GB), no una página de error
          sz=$(stat -c%s "$DEST")
          echo "Tamaño descargado: $sz bytes"
          if [ "$sz" -lt 1000000000 ]; then
            echo "ERROR: archivo demasiado pequeño ($sz bytes) — descarga inválida"; exit 1
          fi
          ls -lh comfyui/models/checkpoints

      - name: Start ComfyUI (CPU)
        run: |
          cd comfyui
          nohup python main.py --cpu --listen 127.0.0.1 --port 8188 > comfyui.log 2>&1 &
          echo "ComfyUI lanzado, esperando arranque..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8188/system_stats | grep -q 200; then
              echo "ComfyUI listo"; break
            fi
            sleep 5
          done

      - name: Generate image
        run: |
          python comfy_batch.py \
            --comfy-url http://127.0.0.1:8188 \
            --prompts ./batch_prompts.json \
            --out ./outputs \
            --workflow-image ./workflows/sdxl_turbo.json \
            --ready-timeout 300 \
            --gen-timeout 1800
          echo "=== outputs ==="
          ls -lh outputs || true

      - name: Show ComfyUI log on failure
        if: failure()
        run: tail -n 100 comfyui/comfyui.log || true

      - name: Commit results (image + status log)
        if: always()
        run: |
          mkdir -p outputs
          {
            echo "run: ${{ github.run_id }}"
            echo "status_job: ${{ job.status }}"
            echo "=== outputs dir ==="
            ls -lh outputs 2>/dev/null || true
            echo "=== ComfyUI log (tail) ==="
            tail -n 120 comfyui/comfyui.log 2>/dev/null || echo "(sin log)"
          } > outputs/_ci_status.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/*.png outputs/_ci_status.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada que commitear"
          else
            git commit -m "ComfyUI CI results [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
